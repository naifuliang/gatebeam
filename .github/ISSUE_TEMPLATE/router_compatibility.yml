name: Router compatibility
description: Report PCP, NAT-PMP, UPnP, or IPv6 router behavior.
title: "[Router] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Router details can identify a household or network. Share only the
        minimum model and firmware information needed to reproduce the issue.
        Never attach a router backup or configuration export. Remove API tokens,
        domains, hostnames, public IP addresses, serial numbers, MAC addresses,
        Wi-Fi names, account names, and screenshots of administration pages.
  - type: input
    id: vendor
    attributes:
      label: Router brand
      description: Brand only; do not include a serial number or account name.
      placeholder: Manufacturer
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Router model
      description: Model family is enough when an exact revision is sensitive.
      placeholder: Model or redacted model family
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Version only; do not attach firmware, backups, or admin screenshots.
      placeholder: Version or release channel
    validations:
      required: true
  - type: checkboxes
    id: protocols
    attributes:
      label: Advertised or enabled capabilities
      description: Select only capabilities visible in sanitized settings or documentation.
      options:
        - label: PCP
        - label: NAT-PMP
        - label: UPnP IGD
        - label: IPv6
        - label: IPv6 firewall or pinhole controls
        - label: None or unknown
  - type: dropdown
    id: topology
    attributes:
      label: Sanitized WAN topology
      description: Do not provide any address, domain, hostname, or provider account.
      options:
        - Public IPv4 on this router
        - Private or carrier-grade NAT IPv4
        - IPv6 prefix delegated to this router
        - Upstream router or double NAT
        - Bridge mode
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: ipv6
    attributes:
      label: IPv6 behavior
      options:
        - Not available
        - Global IPv6 available
        - Link-local IPv6 only
        - IPv6 available but inbound firewall is closed
        - Unknown
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: |
        Describe Gatebeam's status, selected protocol, timing, and cleanup
        behavior. A successful local check or router response does not prove
        public reachability.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: |
        Include only the smallest redacted error text. Do not paste packet
        captures, SOAP responses, router exports, addresses, domains, tokens,
        serial numbers, or MAC addresses into a public issue.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed tokens, domains, hostnames, public IP addresses, serial numbers, MAC addresses, Wi-Fi names, router backups, and account information.
          required: true
        - label: I understand that router compatibility varies by firmware, topology, firewall, carrier network, and ISP policy.
          required: true
