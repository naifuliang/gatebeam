name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow or limitation should this address?
      placeholder: Describe the user problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the behavior you would like to see.
      placeholder: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share other approaches or workarounds you have tried.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not include credentials, private hostnames, or public IP addresses.
          required: true
