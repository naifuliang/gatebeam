name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow without including an API token, domain, hostname,
        public IP address, router backup, Keychain content, or account details.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow or limitation should this address?
      placeholder: Describe the user problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the behavior you would like to see.
      placeholder: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share other approaches or workarounds you have tried.
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Cloudflare DDNS
        - IPv4 or IPv6 discovery
        - Proxy policy
        - Router compatibility
        - Temporary access
        - Security or privacy
        - Menu-bar or settings UI
        - Installation or updates
        - Repository or release process
        - Other
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and failure behavior
      description: |
        If relevant, explain how the feature should fail closed, clean up router
        state, protect credentials, preserve rollback, or avoid false public
        reachability claims.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This request contains no API token, domain, hostname, public IP address, router backup, Keychain data, or personal information.
          required: true
