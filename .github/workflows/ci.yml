name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Backend, proxy policy, and app build
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run backend tests
        run: ./scripts/test_backend.sh

      - name: Run proxy policy tests
        run: ./scripts/test_proxy_policy.sh

      - name: Build app
        run: ./scripts/build_app.sh
