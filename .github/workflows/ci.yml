name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Test, isolate, and build Gatebeam
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        # actions/checkout v4.4.0, verified against the official release ref.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run backend tests
        run: ./scripts/test_backend.sh

      - name: Run proxy policy tests
        run: ./scripts/test_proxy_policy.sh

      - name: Run integration contract tests
        run: ./scripts/test_integration_contract.sh

      - name: Run integration contract tests with Thread Sanitizer
        run: ./scripts/test_integration_tsan.sh

      - name: Run formal release pipeline tests
        run: ./scripts/test_release_pipeline.sh

      - name: Verify Keychain and code-signing identity
        run: ./scripts/test_keychain_identity.sh

      - name: Run upgrade compatibility tests
        run: ./scripts/test_upgrade.sh

      - name: Run UI validation isolation tests
        run: ./scripts/test_ui_validation.sh

      - name: Validate build assets
        run: ./scripts/test_build_assets.sh

      - name: Build complete app
        run: ./scripts/build_app.sh

      - name: Verify app signature
        run: codesign --verify --deep --strict ./dist/Gatebeam.app

      - name: Scan source and app for private material
        env:
          PRIVACY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRIVACY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "${PRIVACY_BASE_SHA}^{commit}" 2>/dev/null; then
            ./scripts/test_privacy.sh --range "${PRIVACY_BASE_SHA}..${PRIVACY_HEAD_SHA}"
          else
            ./scripts/test_privacy.sh --range "${PRIVACY_HEAD_SHA}"
          fi

      - name: Check committed patch whitespace
        run: git show --check HEAD

      - name: Check pull request range whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
